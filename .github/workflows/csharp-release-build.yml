name: Build and Release tait

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build C# on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: ./csharp

    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact_name: tait-csharp-win-x64
          - os: ubuntu-latest
            rid: linux-x64
            artifact_name: tait-csharp-linux-x64
          - os: macos-latest
            rid: osx-x64
            artifact_name: tait-csharp-osx-x64
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      
      - name: Run Tests
        run: dotnet test

      - name: Publish Binary
        run: >
          dotnet publish -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          /p:PublishSingleFile=true
          /p:PublishTrimmed=true
          /p:AssemblyName=${{ matrix.artifact_name }}
          /p:IncludeNativeLibrariesForSelfContained=true
          -o ./publish-output

      - name: Create Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./csharp/publish-output/${{ matrix.artifact_name }}
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}